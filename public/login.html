<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบ · ระบบสต็อกและจัดซื้อ</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1b2d; color: #0f172a; font: 15px/1.55 "Leelawadee UI", "Segoe UI", Tahoma, sans-serif; padding: 16px; }
  form { width: min(380px, 100%); background: #fff; border-radius: 16px; padding: 30px 28px; box-shadow: 0 24px 60px rgba(0, 0, 0, .35); }
  .logo { width: 46px; height: 46px; border-radius: 12px; background: linear-gradient(135deg, #14b8a6, #0f766e); display: grid; place-items: center; margin-bottom: 16px; }
  .logo svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  h1 { margin: 0; font-size: 20px; }
  p { margin: 4px 0 22px; color: #64748b; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 9px; font: inherit; }
  input:focus { outline: 0; border-color: #0f766e; box-shadow: 0 0 0 3px rgba(15, 118, 110, .15); }
  button { width: 100%; margin-top: 16px; padding: 11px; border: 0; border-radius: 9px; background: #0f766e; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { background: #0b5d57; }
  #error { color: #b91c1c; font-size: 14px; min-height: 22px; margin-top: 10px; }
</style>
</head>
<body>
<form id="form">
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg></div>
  <h1>Stock &amp; Purchasing</h1>
  <p>ระบบสต็อกและจัดซื้อ</p>
  <label for="password">รหัสผ่าน</label>
  <input id="password" type="password" autocomplete="current-password" autofocus required>
  <button type="submit">เข้าสู่ระบบ</button>
  <div id="error" role="alert"></div>
</form>
<script>
document.getElementById('form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const error = document.getElementById('error');
  error.textContent = '';
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ password: document.getElementById('password').value }),
  });
  if (res.ok) return location.replace('/');
  error.textContent = (await res.json()).error;
});
</script>
</body>
</html>
